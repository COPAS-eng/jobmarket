name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Install dependencies
        run: npm ci --workspaces --if-present

      - name: Lint
        run: npx turbo run lint --filter=web --filter=api

      - name: Typecheck
        run: npx turbo run typecheck --filter=web --filter=api

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobmarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d jobmarket_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Install dependencies
        run: npm ci --workspaces --if-present

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/api

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/jobmarket_test?schema=public

      - name: Run tests with coverage
        run: npx turbo run test --filter=web --filter=api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/jobmarket_test?schema=public

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: |
            apps/web/coverage
            apps/api/coverage
          retention-days: 7

      - name: Enforce coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # web
          npx nyc check-coverage --statements 80 --branches 70 --functions 80 --lines 80 --report-dir apps/web/coverage
          # api
          npx nyc check-coverage --statements 80 --branches 70 --functions 80 --lines 80 --report-dir apps/api/coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Install dependencies
        run: npm ci --workspaces --if-present

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/api

      - name: Build all packages
        run: npx turbo run build --filter=web --filter=api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: |
            apps/web/dist
            apps/api/dist
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

      - name: Install dependencies
        run: npm ci --workspaces --if-present

      - name: Build applications
        run: npx turbo run build --filter=web --filter=api

      - name: Start services
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 10

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop services
        run: docker compose -f docker/docker-compose.yml down
        if: always()

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t jobmarket-web:test -f apps/web/Dockerfile apps/web
          docker build -t jobmarket-api:test -f apps/api/Dockerfile apps/api

      - name: Start containers
        run: |
          docker network create jobmarket-test
          docker run -d --name jobmarket-db --network jobmarket-test \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=jobmarket_test \
            postgres:16-alpine
          docker run -d --name jobmarket-api --network jobmarket-test \
            -e DATABASE_URL=postgresql://test:test@jobmarket-db:5432/jobmarket_test?schema=public \
            -p 3001:3001 jobmarket-api:test
          docker run -d --name jobmarket-web --network jobmarket-test \
            -p 3000:3000 jobmarket-web:test
          sleep 15

      - name: Smoke test API
        run: |
          curl -f http://localhost:3001/health || exit 1

      - name: Smoke test Web
        run: |
          curl -f http://localhost:3000 || exit 1

      - name: Cleanup
        run: |
          docker stop jobmarket-web jobmarket-api jobmarket-db || true
          docker rm jobmarket-web jobmarket-api jobmarket-db || true
          docker network rm jobmarket-test || true
        if: always()

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, e2e, docker-smoke]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to preview environment
        run: echo "Deploy preview logic here (Vercel, Netlify, etc.)"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, e2e, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploy production logic here (Vercel, Railway, AWS, etc.)"