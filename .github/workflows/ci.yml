name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format -- --check

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobmarket_test
          POSTGRES_USER: jobmarket
          POSTGRES_PASSWORD: testpassword
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmarket -d jobmarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api
        env:
          DATABASE_URL: postgresql://jobmarket:testpassword@localhost:5432/jobmarket_test?schema=public

      - name: Run database migrations
        run: npm run db:migrate --workspace=apps/api
        env:
          DATABASE_URL: postgresql://jobmarket:testpassword@localhost:5432/jobmarket_test?schema=public

      - name: Run API tests
        run: npm run test --workspace=apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://jobmarket:testpassword@localhost:5432/jobmarket_test?schema=public
          JWT_SECRET: test-jwt-secret-key-min-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-different-from-above
          STRIPE_SECRET_KEY: sk_test_doesnotmatter
          STRIPE_WEBHOOK_SECRET: whsec_test
          FRONTEND_URL: http://localhost:5173

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test --workspace=apps/web

      - name: Build web
        run: npm run build:web

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobmarket_e2e
          POSTGRES_USER: jobmarket
          POSTGRES_PASSWORD: testpassword
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmarket -d jobmarket_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build applications
        run: npm run build

      - name: Start services
        run: |
          docker-compose -f docker/docker-compose.yml up -d postgres redis
          sleep 10

      - name: Run database migrations
        run: npm run db:migrate --workspace=apps/api
        env:
          DATABASE_URL: postgresql://jobmarket:testpassword@localhost:5432/jobmarket_e2e?schema=public

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: npm run test:e2e --workspace=apps/web
        env:
          DATABASE_URL: postgresql://jobmarket:testpassword@localhost:5432/jobmarket_e2e?schema=public
          JWT_SECRET: test-jwt-secret-key-min-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-different-from-above
          STRIPE_SECRET_KEY: sk_test_doesnotmatter
          STRIPE_WEBHOOK_SECRET: whsec_test
          FRONTEND_URL: http://localhost:5173
          VITE_API_URL: http://localhost:3001/api

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-api, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jobmarket-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: api-runner
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jobmarket-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: web-runner
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max